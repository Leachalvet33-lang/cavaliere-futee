<div id="site-header"></div>

<main id="main">

  <section class="page-hero oops-hero">
    <div class="container">
      <span class="eyebrow" style="color:var(--terracotta);">Sélectionné avec exigence, recommandé avec conviction</span>
      <h1>Nos recommandations</h1>

    <div class="container" style="max-width:880px;">

<script src="js/main.js?v=188"></script>
<script>
  function cfOopsCard(o) {
    return `
      <article class="oops-card reveal">
        <div class="oops-head">
          <div>
            <span class="card-tag">${o.category}</span>
            <h3>${o.title}</h3>
          </div>
        </div>
        <div class="oops-grid-2">
          <div class="oops-col piege">
            <strong>Le piège</strong>
            <p>${o.piege}</p>
          </div>
          <div class="oops-col conseil">
            <strong>Ce qu'on te conseille</strong>
            <p>${o.conseil}</p>
          </div>
        </div>
      </article>
    `;
  }

  document.addEventListener('partialsReady', () => {
    document.getElementById('oops-list').innerHTML = CF_DATA.oops.map(cfOopsCard).join('');
    setupScrollReveal();
  });
</script>
